name: "test"
on:
  push:
    branches:
      - main
    paths-ignore:
      - "packages/core/ui/**"
      - "packages/core/docs/**"
      - ".gitignore"
      - "README.md"
      - "LICENSE.md"
      - "netlify.toml"
      - ".github/workflows/*.yaml"
      - "!.github/workflows/test.yaml"
  pull_request:
    branches:
      - main
      - integration-*
    paths-ignore:
      - "packages/core/ui/**"
      - "packages/core/docs/**"
      - ".gitignore"
      - "README.md"
      - "LICENSE.md"
      - "netlify.toml"
      - ".github/workflows/*.yaml"
      - "!.github/workflows/test.yaml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set up Python 3.10.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run Pytests
        run: |
          pytest -m "ci" --cov=packages tests
          coverage report
